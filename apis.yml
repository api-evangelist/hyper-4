aid: hyper-4
name: Hyper 4
description: >-
  Hyper (heyhyper.ai) is a Y Combinator-backed startup building "the self-driving
  company brain" — a knowledge-management platform that assembles a centralized,
  self-maintaining knowledge graph from a team's emails, Slack, GitHub, calendars,
  and other work sources, then feeds that context back into AI agents and tools so
  they act with accurate company memory and require fewer repeated corrections.
  Founded in 2026 by Shalin Shah and Kanyes Thaker and based in San Francisco, the
  company was surfaced as a Y Combinator portfolio company and added to the API
  Evangelist network as an enrichment lead. As of this profile Hyper is very
  early-stage, publishing only a marketing landing page at heyhyper.ai with no
  public developer portal, API reference, SDKs, or machine-readable API surface
  yet available; this record captures verified company identity and will be
  re-enriched as a developer platform is published.
